[main]
font=JetBrains Mono:weight=medium:size=12
dpi-aware=yes
prompt=" ❯ "
icon-theme=Papirus-Dark
terminal=foot
layer=overlay
width=45
lines=12
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=24
letter-spacing=0
fields=name,generic,comment,categories,filename
exit-on-keyboard-focus-loss=yes

[colors]
background=0d0e1ae6
text=e4e4f4ff
prompt=ff4d9eff
placeholder=6b6c8aff
input=e4e4f4ff
match=ff4d9eff
selection=2d2e4dff
selection-text=b4a7e8ff
selection-match=ff4d9eff
counter=6b6c8aff
border=ff4d9eff

[border]
width=2
radius=10
