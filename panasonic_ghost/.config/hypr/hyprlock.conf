general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper.jpg
    blur_passes = 4
    blur_size = 10
    contrast = 0.85
    brightness = 0.7
    vibrancy = 0.2
}

# Pole hasła
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(ff4d9eff)
    inner_color = rgba(13, 14, 26, 0.6)
    font_color = rgb(228, 228, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##b4a7e8"><i>Hasło...</i></span>
    hide_input = false
    rounding = 12
    check_color = rgba(7dffafff)
    fail_color = rgba(ff4d9eff)
    fail_text = <span foreground="##ff4d9e">$FAIL</span>
    capslock_color = rgba(ffd06bff)
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(255, 77, 158, 0.4)
}

# Zegar
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(228, 228, 244, 0.95)
    font_size = 110
    font_family = JetBrains Mono Bold
    position = 0, 240
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(255, 77, 158, 0.5)
}

# Data
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %-d %B %Y")"
    color = rgba(180, 167, 232, 0.85)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 130
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = rgba(136, 197, 230, 0.7)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -50
    halign = center
    valign = center
}
