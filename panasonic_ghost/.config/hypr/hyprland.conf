# ===== CF-SV STARTOWA KONFIGURACJA =====

# Monitor — eDP-1 to wewnętrzny, auto = native res + refresh
monitor=,preferred,auto,1

# Modyfikator
$mainMod = SUPER

# Aplikacje domyślne
$terminal = foot
$fileManager = $terminal -e yazi
$menu = fuzzel

# ===== AUTOSTART =====
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start pipewire pipewire-pulse wireplumber

# ===== INPUT =====
input {
    kb_layout = pl
    kb_options = caps:escape,japan:hztg_escape,lv3:henkan_switch  # caps lock działa jako escape (vim-friendly)
    follow_mouse = 1
    sensitivity = 0.8
    accel_profile = adaptive
    
    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.4
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# Touchpad gesty
gestures {
    #workspace_swipe = true
    #workspace_swipe_fingers = 3
}

# ===== WYGLĄD =====
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    # Edgerunner gradient — magenta -> lavender
    col.active_border = rgba(ff4d9eff) rgba(b4a7e8ff) 45deg
    col.inactive_border = rgba(252640aa)
    
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    
    # Aktywne okno wyraziste, nieaktywne lekko przyciemnione
    active_opacity = 1.0
    inactive_opacity = 0.92
    
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
    
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(0d0e1aee)
        color_inactive = rgba(0d0e1a99)
    }
}

# Kursor neon
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24



animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

#dwindle {
#    pseudotile = true
#    preserve_split = true
#}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
#    vfr = true       # variable frame rate, oszczędza baterię
    vrr = 1          # adaptive sync gdy wspierane
}

# ===== ENV (pod GTK + Wayland) =====
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1

# ===== KEYBINDINGS =====
# Aplikacje
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
#bind = $mainMod, J, togglesplit,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, L, exec, hyprlock

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Vim-style focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll przez workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize z myszką
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot
bind = , Print, exec, hyprshot -m output
bind = $mainMod, Print, exec, hyprshot -m window
bind = $mainMod SHIFT, S, exec, hyprshot -m region

# ===== KLAWISZE FUNKCYJNE CF-SV =====
# Volume (PipeWire/PulseAudio)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
binde = , XF86MonBrightnessUp, exec, brightnessctl s +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Media keys
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

